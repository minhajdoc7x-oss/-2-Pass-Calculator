<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>+2 Pass Predictor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
margin:0;
padding:20px;
}

.card{
background:#fff;
padding:30px;
border-radius:25px;
box-shadow:0 20px 40px rgba(0,0,0,0.3);
width:100%;
max-width:420px;
text-align:center;
}

h2{
color:#1e3c72;
margin-bottom:10px;
font-weight:600;
font-size:1.5rem;
}

.line{
height:4px;
width:50px;
background:#2ecc71;
margin:0 auto 25px;
border-radius:2px;
}

.input-group{
text-align:left;
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
color:#333;
font-size:0.85rem;
font-weight:600;
text-transform:uppercase;
}

select,input{
width:100%;
padding:14px;
border:2px solid #edf2f7;
border-radius:15px;
outline:none;
font-size:1rem;
background:#f8fafc;
}

button{
width:100%;
padding:16px;
background:#2ecc71;
color:white;
border:none;
border-radius:15px;
font-size:1.1rem;
font-weight:600;
cursor:pointer;
box-shadow:0 4px 15px rgba(46,204,113,0.3);
transition:0.3s;
}

button:hover{
background:#27ae60;
transform:translateY(-2px);
}

#result{
margin-top:25px;
padding:20px;
border-radius:15px;
display:none;
animation:slideUp 0.4s ease-out;
}

@keyframes slideUp{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

.pass-card{
background:#dcfce7;
color:#166534;
border:1px solid #bbf7d0;
}

.need-card{
background:#fef9c3;
color:#854d0e;
border:1px solid #fef08a;
}

.big-mark{
font-size:2rem;
font-weight:700;
display:block;
margin:5px 0;
}

/* Attractive Malayalam text */

.malayalam-text{
font-weight:700;
color:#ff3b3b;
text-shadow:0 0 6px rgba(255,59,59,0.4);
display:block;
margin-top:5px;
}

/* Footer animation */

.footer-section{
margin-top:30px;
border-top:1px solid #eee;
padding-top:20px;
}

.dev-by{
font-size:0.7rem;
font-weight:700;
color:#888;
letter-spacing:2px;
margin-bottom:10px;
}

.animated-name{
display:flex;
justify-content:center;
gap:4px;
}

.animated-name span{
display:inline-block;
font-size:2rem;
font-weight:900;
color:#4876ff;
text-shadow:2px 2px 0px #eee,4px 4px 0px rgba(0,0,0,0.1);
animation:bounce 1.5s infinite ease-in-out;
}

.animated-name span:nth-child(1){animation-delay:0.1s;}
.animated-name span:nth-child(2){animation-delay:0.2s;}
.animated-name span:nth-child(3){animation-delay:0.3s;}
.animated-name span:nth-child(4){animation-delay:0.4s;}
.animated-name span:nth-child(5){animation-delay:0.5s;}
.animated-name span:nth-child(6){animation-delay:0.6s;}

@keyframes bounce{
0%,100%{transform:translateY(0) scale(1);}
50%{transform:translateY(-15px) scale(1.1);text-shadow:0 15px 10px rgba(0,0,0,0.2);}
}

.copy{
margin-top:15px;
font-size:0.75rem;
color:#555;
}
/* Mobile screen fix */

@media (max-width:480px){

body{
padding:15px;
}

.card{
width:100%;
max-width:100%;
padding:22px;
border-radius:20px;
}

h2{
font-size:1.3rem;
}

button{
padding:14px;
font-size:1rem;
}

.big-mark{
font-size:1.8rem;
}

}
</style>
    
</head>

<body>

<div class="card">

<h2>+2 Pass Calculator 🎯</h2>
<div class="line"></div>

<div class="input-group">
<label>Subject Type</label>
<select id="subType">
<option value="80">80 Mark Paper (BS, Eco, Lang, Eng)</option>
<option value="60">60 Mark Paper (Acc, CA)</option>
</select>
</div>

<div class="input-group">
<label>Plus One TE Mark (Not Add CE)</label>
<input type="number" id="p1Mark" placeholder="Enter mark here..." min="0">
</div>

<button onclick="calculate()">Check Now</button>

<div id="result"></div>

<div class="footer-section">

<div class="dev-by">DEVELOPED BY</div>

<div class="animated-name">
<span>M</span><span>I</span><span>N</span><span>H</span><span>A</span><span>J</span>
</div>

<div class="copy">Plus Two Exam Pass Portal © 2026</div>

</div>

</div>

<script>

function calculate(){

const type=parseInt(document.getElementById('subType').value);
const p1=parseFloat(document.getElementById('p1Mark').value);
const resultDiv=document.getElementById('result');

if(isNaN(p1)){
alert("ദയവായി മാർക്ക് എന്റർ ചെയ്യുക!");
return;
}

let totalNeeded=(type===80)?48:36;
let p2Required=totalNeeded-p1;

resultDiv.style.display="block";

if(p2Required<=0){

resultDiv.className="pass-card";

resultDiv.innerHTML=`
<span>Status: <b>SAFE</b> ✅</span>
<span class="big-mark">PASSED!</span>
<small class="malayalam-text">രണ്ട് വർഷത്തെയും കൂടി Pass മാർക്ക് ആയിക്കഴിഞ്ഞു!</small>
`;

}else{

resultDiv.className="need-card";

resultDiv.innerHTML=`
<span>Status: <b>TARGET</b> ⚡</span>
<span class="big-mark">${p2Required} Marks</span>
<small class="malayalam-text">“Plus Two പരീക്ഷയിൽ pass ആകാൻ ഇത്ര മാർക്ക് എടുക്കണം.”</small>
`;

}

}

</script>
      <script>
        // Right click block cheyyan
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Keyboard shortcuts block cheyyan
        document.onkeydown = function(e) {
            if(event.keyCode == 123) { return false; } // F12
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; }
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; }
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; }
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; }
        }
    </script>

</body>
</html>
